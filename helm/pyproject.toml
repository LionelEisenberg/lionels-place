[project]
name = "helm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.36",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.1",
    "PyJWT>=2.8.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
]
